name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show project
        run: |
          echo "PROJECT ROOT:"
          pwd
          echo "FILES:"
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
